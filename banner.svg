.cur{fill:#4ade80;animation:bl 1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.core{animation:co 2.4s ease-in-out infinite} @keyframes co{0%,100%{opacity:.45}50%{opacity:1}}
